ticker: CMG
name: Chipotle Mexican Grill
template: operating
industry: restaurant
period: quarter
history_start: 2014Q1
# COVID exclusion was tested 2026-10-01 and made out-of-COVID scores slightly worse, so it is off.

kpis:
  # Year-over-year KPIs use target: change: the news since the last report is in how the
  # signals moved since then (tested 2026-10-01: level + lag lost to naive on every KPI).
  transactions: {unit: pct, target: change, description: "comparable restaurant transactions, yoy %"}
  check:        {unit: pct, target: change, description: "comparable average check, yoy %"}
  # Modeled directly, not as transactions + check: CMG disclosed transactions and
  # check consistently only from ~2023, so the formula would leave comps with ~14 quarters.
  comps:        {unit: pct, target: change, description: "comparable restaurant sales, yoy %"}
  rlom:         {unit: pct, target: change, description: "restaurant level operating margin, % of revenue"}
  # Total revenue growth (XBRL): comps plus new restaurants, so store count matters here.
  revenue_growth: {unit: pct, target: change, description: "total revenue, yoy %"}

primitives: [demand, capacity, price, input_cost, labor, sentiment, expansion]

signals:
  - series: "fred:RSFSDP"            # Census MRTS retail sales, food services and drinking places
    primitive: demand
    confidence: 0.5
    half_life_days: 45
    transform: yoy_log
  - series: "wiki:Chipotle_Mexican_Grill"
    primitive: demand
    confidence: 0.25
    half_life_days: 30
    transform: yoy_log
    notes: >
      Attention, not sentiment direction: views spike in both launches and
      food-safety scares. Low confidence; leave-one-out decides if it stays.
  - series: "fred:CUSR0000SEFV"      # CPI food away from home, SA
    primitive: price
    confidence: 0.5
    half_life_days: 60
    transform: yoy_log
  - series: "bls:CES7072200003"      # avg hourly earnings, food services and drinking places
    primitive: labor
    confidence: 0.6
    half_life_days: 60
    transform: yoy_log
  - series: "fred:APU0000703112"     # avg price, ground beef 100% beef, per lb
    primitive: input_cost
    lag_days: 30
    confidence: 0.4
    half_life_days: 60
    transform: yoy_log
  - series: "fred:APU0000706111"     # avg price, chicken, fresh whole, per lb
    primitive: input_cost
    lag_days: 30
    confidence: 0.3
    half_life_days: 60
    transform: yoy_log

  - series: "gdelt:tone:chipotle"     # average tone of news mentioning Chipotle (from 2017)
    primitive: sentiment
    confidence: 0.5
    half_life_days: 21
    transform: level
  - series: "sitemap:chipotle_stores" # US restaurant pages on the store locator (Wayback from 2022)
    primitive: capacity
    confidence: 0.6
    half_life_days: 60
    transform: yoy_log
  - series: "sitemap:chipotle_jobs"   # open postings on the careers site (Wayback from late 2023)
    primitive: labor
    confidence: 0.3
    half_life_days: 30
    transform: yoy_log
    notes: More postings can mean expansion or turnover; low confidence until validated.

edges:
  - {from: demand,     to: comps,        prior_mean: 0.8,  prior_sd: 0.3}
  - {from: sentiment,  to: comps,        prior_mean: 0.3,  prior_sd: 0.3}
  - {from: sentiment,  to: transactions, prior_mean: 0.3,  prior_sd: 0.3}
  - {from: demand,     to: revenue_growth, prior_mean: 0.6, prior_sd: 0.3}
  - {from: price,      to: revenue_growth, prior_mean: 0.3, prior_sd: 0.3}
  - {from: capacity,   to: revenue_growth, prior_mean: 0.6, prior_sd: 0.3}
  - {from: price,      to: comps,        prior_mean: 0.4,  prior_sd: 0.3}
  - {from: demand,     to: transactions, prior_mean: 1.0,  prior_sd: 0.3}
  - {from: price,      to: check,        prior_mean: 1.0,  prior_sd: 0.3}
  - {from: input_cost, to: rlom,         prior_mean: -0.5, prior_sd: 0.3}
  - {from: labor,      to: rlom,         prior_mean: -0.4, prior_sd: 0.3}
  - {from: price,      to: rlom,         prior_mean: 0.3,  prior_sd: 0.3}
  - {from: demand,     to: rlom,         prior_mean: 0.3,  prior_sd: 0.3}

baselines: [naive_last, seasonal_naive, guidance, consensus]

ground_truth:
  xbrl:
    cik: "1058090"
    rules:
      # CMG reported revenue as FoodAndBeverageRevenue before 2017 (it was ~99% of revenue).
      revenue_growth: {kind: yoy, concepts: [RevenueFromContractWithCustomerExcludingAssessedTax, Revenues, FoodAndBeverageRevenue]}
  edgar:
    cik: "1058090"
    forms: ["8-K"]
    items: ["2.02"]
    # Earnings 8-Ks filed without item 2.02 (2016Q2 was filed under 9.01 only).
    include_accessions: ["0001058090-16-000078"]
    # Ordered regex rules per KPI; first match wins. (?P<value>) is the number,
    # (?P<dir>) flips the sign when it contains a negative word. Exact highlight
    # bullets come first because headlines round ("9% comparable sales growth").
    rules:
      comps:
        # 2016Q4 bullet: "for the month of December increased 14.7% and declined 4.8% for the full quarter"
        - pattern: 'comparable restaurant sales for the month of \w+ (?:increased|decreased|declined) [\d.]+ ?% and (?P<dir>increased|decreased|declined) (?P<value>\d+(?:\.\d+)?) ?% for the full quarter'
        - pattern: 'comparable restaurant sales (?P<dir>increased|decreased|declined|grew|fell) (?:by )?(?P<value>\d+(?:\.\d+)?) ?%'
        - pattern: '(?P<value>\d+(?:\.\d+)?) ?% (?P<dir>increase|decrease|decline) in comparable restaurant sales'
        - pattern: 'comparable restaurant sales (?P<dir>increasing|decreasing|declining|increase|decrease|accelerate to|of) (?P<value>\d+(?:\.\d+)?) ?%'
      transactions:
        - pattern: 'comparable restaurant transactions (?P<dir>increased|decreased|declined|grew) (?:by )?(?P<value>\d+(?:\.\d+)?) ?%'
        - pattern: '(?P<dir>higher|lower) transactions of (?:nearly |approximately |about )?(?P<value>\d+(?:\.\d+)?) ?%'
        - pattern: '(?P<value>\d+(?:\.\d+)?) ?% (?P<dir>increase|decrease|decline) in (?:comparable restaurant )?transactions'
        - pattern: '(?P<value>\d+(?:\.\d+)?) ?% (?P<dir>fewer|more) comparable restaurant transactions'
        - pattern: '(?P<value>\d+(?:\.\d+)?) ?% comparable restaurant transactions (?P<dir>growth|decline)'
      check:
        - pattern: '(?P<value>\d+(?:\.\d+)?) ?% (?P<dir>increase|decrease|decline) in (?:the )?average check'
        - pattern: 'average check (?P<dir>increase|decrease|growth|decline) of (?:nearly |approximately |about )?(?P<value>\d+(?:\.\d+)?) ?%'
        - pattern: '(?P<dir>higher|lower) average check of (?P<value>\d+(?:\.\d+)?) ?%'
        - pattern: 'average check (?P<dir>increased|decreased|declined) (?:by )?(?P<value>\d+(?:\.\d+)?) ?%'
      rlom:
        - pattern: 'restaurant level operating margin ?1? (?:was|of) (?P<value>\d+(?:\.\d+)?) ?%'
        - pattern: 'restaurant level operating margin (?:increased|decreased) to (?P<value>\d+(?:\.\d+)?) ?%'
