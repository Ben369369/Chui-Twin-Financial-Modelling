ticker: DAL
name: Delta Air Lines
template: operating
industry: airline
period: quarter
history_start: 2014Q1
# COVID collapse and recovery (revenue growth -88% to +385%) is a regime break, not
# something these signals should be calibrated on. Still forecast and scored.
exclude_from_calibration: ["2020Q1:2022Q4"]

kpis:
  # Anchored on management guidance: models the surprise vs guidance from signal moves since it was issued.
  revenue_growth: {unit: pct, target: change, anchor: guidance, description: "total operating revenue, yoy %"}
  # Airline margins are seasonal (summer peak, Q1 trough): same quarter last year carries most of the signal.
  op_margin:
    unit: pct
    lag: {prior_mean: 0.3, prior_sd: 0.2}
    seasonal_lag: {prior_mean: 0.6, prior_sd: 0.2}
    description: "GAAP operating margin, % of revenue"

primitives: [demand, capacity, price, input_cost, labor, sentiment]

signals:
  - series: "tsa:checkpoint_throughput"   # daily TSA checkpoint travelers (from 2019)
    primitive: demand
    confidence: 0.6
    half_life_days: 30
    transform: yoy_log
  - series: "wiki:Delta_Air_Lines"
    primitive: demand
    confidence: 0.2
    half_life_days: 30
    transform: yoy_log
  - series: "fred:CUSR0000SETG01"         # CPI airline fares, SA
    primitive: price
    confidence: 0.5
    half_life_days: 60
    transform: yoy_log
  - series: "fred:DJFUELUSGULF"           # US Gulf Coast kerosene-type jet fuel, daily
    primitive: input_cost
    confidence: 0.7
    half_life_days: 30
    transform: yoy_log
  - series: "bls:CES4348100003"           # avg hourly earnings, air transportation
    primitive: labor
    confidence: 0.5
    half_life_days: 60
    transform: yoy_log

  - series: "gdelt:tone:delta air lines"   # average tone of news mentioning Delta Air Lines (from 2017)
    primitive: sentiment
    confidence: 0.5
    half_life_days: 21
    transform: level

edges:
  - {from: demand,     to: revenue_growth, prior_mean: 0.8,  prior_sd: 0.3}
  - {from: sentiment,  to: revenue_growth, prior_mean: 0.2,  prior_sd: 0.2}
  - {from: price,      to: revenue_growth, prior_mean: 0.4,  prior_sd: 0.3}
  - {from: capacity,   to: revenue_growth, prior_mean: 0.2,  prior_sd: 0.2}
  - {from: input_cost, to: op_margin,      prior_mean: -0.6, prior_sd: 0.3}
  - {from: labor,      to: op_margin,      prior_mean: -0.3, prior_sd: 0.3}
  - {from: price,      to: op_margin,      prior_mean: 0.4,  prior_sd: 0.3}
  - {from: demand,     to: op_margin,      prior_mean: 0.4,  prior_sd: 0.3}

baselines: [naive_last, seasonal_naive, guidance, consensus]

ground_truth:
  # XBRL company facts: GAAP, same structure for every SEC filer. Press-release
  # text mixes GAAP/adjusted margins and compared 2021-22 revenue to 2019.
  # Revenue concept changed with ASC 606 (2018); concepts are tried in order.
  xbrl:
    cik: "27904"
    rules:
      revenue_growth: {kind: yoy, concepts: [RevenueFromContractWithCustomerExcludingAssessedTax, Revenues]}
      op_margin:
        kind: ratio
        numerator: [OperatingIncomeLoss]
        denominator: [RevenueFromContractWithCustomerExcludingAssessedTax, Revenues]
  # Earnings releases: no KPI rules (XBRL covers KPIs), only management guidance.
  # Guidance is for ADJUSTED revenue (ex refinery sales) while the KPI is GAAP: approximate bar.
  # Pre-2023 outlooks compared with 2019, not the prior year, so rules require YoY wording.
  edgar:
    cik: "27904"
    forms: ["8-K"]
    items: ["2.02"]
    rules: {}
    guidance:
      revenue_growth:
        - pattern: '(?P<q>[1-4])Q(?P<yy>\d\d)\s+(?:Forecast\s+)?(?:FY\s?\d{4}\s+Forecast\d?\s+)?Total Revenue\s?\d?\s+YoY\s+(?P<lo_dir>Up|Down|\+|-)?\s?(?P<lo>\d+(?:\.\d+)?)\s?%?\s?-\s?(?P<hi_dir>up|down)?\s?(?P<hi>\d+(?:\.\d+)?)\s?%'
          period: explicit
        - pattern: 'expect (?:the )?(?:March|June|September|December) quarter (?:adjusted |total )?revenue (?:growth )?to be (?P<lo>\d+(?:\.\d+)?) to (?P<hi>\d+(?:\.\d+)?) percent higher than (?:the prior year|(?!2019)20\d\d)'
          period: release_quarter
        - pattern: 'expect total revenue (?:growth )?to be (?P<lo>flat|\d+(?:\.\d+)?) to up (?P<hi>\d+(?:\.\d+)?) percent compared to the prior year'
          period: release_quarter
        - pattern: 'expect total revenue growth of (?P<lo>\d+(?:\.\d+)?) to (?P<hi>\d+(?:\.\d+)?) percent compared to the (?:March|June|September|December) quarter 20\d\d'
          period: release_quarter
        # From 2026 Delta guides in words: "3Q26 Total Revenue YoY (%) Up Mid-Teens".
        - pattern: '(?P<q>[1-4])Q(?P<yy>\d\d)\s+Total Revenue\s+YoY\s+\(%\)\s+(?P<lo_dir>Up|Down)\s+(?P<qual>low|mid|high)[- ](?P<band>single[- ]digits?|teens)'
          period: explicit
