ticker: DAL
name: Delta Air Lines
template: operating
industry: airline
period: quarter
history_start: 2014Q1
# COVID collapse and recovery (revenue growth -88% to +385%) is a regime break, not
# something these signals should be calibrated on. Still forecast and scored.
exclude_from_calibration: ["2020Q1:2022Q4"]

kpis:
  # GAAP revenue includes third-party refinery sales, which move with fuel prices (+76% yoy in 2026Q3,
  # about 6.7 points of growth); Delta's guidance excludes them. Still anchored on that guidance, an
  # approximate bar: the walk-forward backtest (2017Q1-2026Q3, 31 quarters) scored CRPS 4.67 anchored vs
  # 5.29 unanchored (2026-11-25; a choice made on the backtest, so selection-biased). The fuel edge below
  # carries part of the refinery wedge. Kept because the earlier scorecard and pending seals use it.
  revenue_growth: {unit: pct, bounds: [-100, null], target: change, anchor: guidance, description: "GAAP total operating revenue, yoy %"}
  # The figure Delta guides to and the Street follows: revenue excluding third-party refinery sales,
  # as stated in each release ("Total Revenue, adjusted"). Anchored on guidance: models the surprise vs
  # guidance from signal moves since it was issued. Stated growth is rounded in some years (to 1 pt in
  # 2021-24 and 2026Q3), which adds at most 0.5 pt of noise.
  revenue_growth_adj: {unit: pct, bounds: [-100, null], target: change, anchor: guidance, description: "total revenue excluding third-party refinery sales (Delta's adjusted figure), yoy %"}
  # Airline margins are seasonal (summer peak, Q1 trough): same quarter last year carries most of the signal.
  op_margin:
    bounds: [null, 100]
    unit: pct
    lag: {prior_mean: 0.3, prior_sd: 0.2}
    seasonal_lag: {prior_mean: 0.6, prior_sd: 0.2}
    description: "GAAP operating margin, % of revenue"

primitives: [demand, capacity, price, input_cost, labor, sentiment]

signals:
  - series: "tsa:checkpoint_throughput"   # daily TSA checkpoint travelers (from 2019)
    primitive: demand
    confidence: 0.6
    half_life_days: 30
    transform: yoy_log
  - series: "wiki:Delta_Air_Lines"
    primitive: demand
    confidence: 0.2
    half_life_days: 30
    transform: yoy_log
  - series: "fred:CUSR0000SETG01"         # CPI airline fares, SA
    primitive: price
    confidence: 0.5
    half_life_days: 60
    transform: yoy_log
  - series: "fred:DJFUELUSGULF"           # US Gulf Coast kerosene-type jet fuel, daily
    primitive: input_cost
    confidence: 0.7
    half_life_days: 30
    transform: yoy_log
  - series: "bls:CES4348100003"           # avg hourly earnings, air transportation
    primitive: labor
    confidence: 0.5
    half_life_days: 60
    transform: yoy_log

  - series: "gdelt:tone:delta air lines"   # average tone of news mentioning Delta Air Lines (from 2017)
    primitive: sentiment
    confidence: 0.5
    half_life_days: 21
    transform: level

edges:
  - {from: demand,     to: revenue_growth, prior_mean: 0.8,  prior_sd: 0.3}
  - {from: sentiment,  to: revenue_growth, prior_mean: 0.2,  prior_sd: 0.2}
  - {from: price,      to: revenue_growth, prior_mean: 0.4,  prior_sd: 0.3}
  - {from: capacity,   to: revenue_growth, prior_mean: 0.2,  prior_sd: 0.2}
  # Refinery sales to third parties rise with fuel prices and are in GAAP revenue only. Added 2026-11-25
  # from the accounting (Delta's revenue note), after the 2026Q3 outcome was known; weak prior. Backtest
  # gain was within noise (CRPS 4.74 -> 4.67).
  - {from: input_cost, to: revenue_growth, prior_mean: 0.3,  prior_sd: 0.3}
  - {from: demand,     to: revenue_growth_adj, prior_mean: 0.8,  prior_sd: 0.3}
  - {from: sentiment,  to: revenue_growth_adj, prior_mean: 0.2,  prior_sd: 0.2}
  - {from: price,      to: revenue_growth_adj, prior_mean: 0.4,  prior_sd: 0.3}
  - {from: capacity,   to: revenue_growth_adj, prior_mean: 0.2,  prior_sd: 0.2}
  - {from: input_cost, to: op_margin,      prior_mean: -0.6, prior_sd: 0.3}
  - {from: labor,      to: op_margin,      prior_mean: -0.3, prior_sd: 0.3}
  - {from: price,      to: op_margin,      prior_mean: 0.4,  prior_sd: 0.3}
  - {from: demand,     to: op_margin,      prior_mean: 0.4,  prior_sd: 0.3}

baselines: [naive_last, seasonal_naive, guidance, consensus]

ground_truth:
  # XBRL company facts: GAAP, same structure for every SEC filer. Press-release
  # text mixes GAAP/adjusted margins and compared 2021-22 revenue to 2019.
  # Revenue concept changed with ASC 606 (2018); concepts are tried in order.
  xbrl:
    cik: "27904"
    rules:
      revenue_growth: {kind: yoy, concepts: [RevenueFromContractWithCustomerExcludingAssessedTax, Revenues]}
      op_margin:
        kind: ratio
        max: 100
        numerator: [OperatingIncomeLoss]
        denominator: [RevenueFromContractWithCustomerExcludingAssessedTax, Revenues]
  # Earnings releases: adjusted revenue growth (ex third-party refinery sales) and management guidance.
  # Guidance is for adjusted revenue: exact bar for revenue_growth_adj, approximate bar for GAAP revenue_growth.
  # Pre-2023 outlooks compared with 2019, not the prior year, so rules require YoY wording.
  edgar:
    cik: "27904"
    forms: ["8-K"]
    items: ["2.02"]
    # Delta's release headers do not state the period in a parseable form; an item 2.02 release
    # reports the quarter before the one it is filed in.
    period_from: filing
    # From 2021Q1 to 2022Q4 the releases' revenue table compares with 2019, not the prior year
    # (e.g. 2021Q4 "(26)%" = 8,430 vs 11,437 in 2019Q4), so those values are not yoy growth.
    exclude_periods: ["2021Q1:2022Q4"]
    rules:
      # Revenue table line, e.g. "Total Revenue, adjusted (See Note A) $ 17,585 16% 15%" (first % = yoy change;
      # second = unit revenue). Negative changes print as "(17.2)%", flat ones as "- %". Present from 2018Q3.
      revenue_growth_adj:
        - pattern: 'Total Revenue,? adjusted(?: \(See Note A\))? \$ ?[\d,]+ \((?P<value>\d+(?:\.\d+)?) ?\) ?%'
          negate: true
        - pattern: 'Total Revenue,? adjusted(?: \(See Note A\))? \$ ?[\d,]+ (?P<value>-|\d+(?:\.\d+)?) ?%'
    guidance:
      revenue_growth_adj: &revenue_guidance
        # From 4Q26 Delta prints a single figure: "4Q26 FY 2026 Total Revenue YoY (%) Approx. 20%".
        - pattern: '(?P<q>[1-4])Q(?P<yy>\d\d)\s+(?:FY\s?\d{4}\s+)?Total Revenue\s+YoY\s+\(%\)\s+Approx\.?\s+(?P<lo>\d+(?:\.\d+)?)\s?%'
          period: explicit
        - pattern: '(?P<q>[1-4])Q(?P<yy>\d\d)\s+(?:Forecast\s+)?(?:FY\s?\d{4}\s+Forecast\d?\s+)?Total Revenue\s?\d?\s+YoY\s+(?P<lo_dir>Up|Down|\+|-)?\s?(?P<lo>\d+(?:\.\d+)?)\s?%?\s?-\s?(?P<hi_dir>up|down)?\s?(?P<hi>\d+(?:\.\d+)?)\s?%'
          period: explicit
        - pattern: 'expect (?:the )?(?:March|June|September|December) quarter (?:adjusted |total )?revenue (?:growth )?to be (?P<lo>\d+(?:\.\d+)?) to (?P<hi>\d+(?:\.\d+)?) percent higher than (?:the prior year|(?!2019)20\d\d)'
          period: release_quarter
        - pattern: 'expect total revenue (?:growth )?to be (?P<lo>flat|\d+(?:\.\d+)?) to up (?P<hi>\d+(?:\.\d+)?) percent compared to the prior year'
          period: release_quarter
        - pattern: 'expect total revenue growth of (?P<lo>\d+(?:\.\d+)?) to (?P<hi>\d+(?:\.\d+)?) percent compared to the (?:March|June|September|December) quarter 20\d\d'
          period: release_quarter
        # From 2026 Delta guides in words: "3Q26 Total Revenue YoY (%) Up Mid-Teens".
        - pattern: '(?P<q>[1-4])Q(?P<yy>\d\d)\s+Total Revenue\s+YoY\s+\(%\)\s+(?P<lo_dir>Up|Down)\s+(?P<qual>low|mid|high)[- ](?P<band>single[- ]digits?|teens)'
          period: explicit
      revenue_growth: *revenue_guidance
