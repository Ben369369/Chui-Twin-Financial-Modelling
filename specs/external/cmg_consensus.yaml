# Consensus estimates for CMG comparable restaurant sales, hand-entered from published news coverage.
# Consensus data itself is licensed (FactSet, Visible Alpha, ...); these are figures reported in public
# articles, each verified against the article text on 2026-10-02. Source: Zacks Equity Research
# "Key Metrics" articles, syndicated by Yahoo Finance and Finviz.
#
# Point in time: the articles are published right after the release, but the figure they quote is the
# pre-release consensus. available_at is therefore set 1 hour before the release (the same as_of the
# backtest uses), not the article time.
#
# The "actual" in each quote matches our EDGAR extraction for that quarter, a cross-check of both.
source: consensus
