[project]
name = "chui-twin"
version = "0.1.0"
description = "Turns public companies into runnable operating models."
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "pydantic>=2.5",
    "pyyaml>=6",
    "requests>=2.31",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
api = ["fastapi>=0.110", "uvicorn>=0.29"]
seal = ["opentimestamps-client>=0.7"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.setuptools]
packages = ["engine", "adapters", "storage"]
