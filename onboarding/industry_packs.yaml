# Industry packs: what a new twin starts from, chosen by the company's SEC SIC code.
# A pack names a template, the shared signals for the industry and KPI defaults.
# Signals here are reused by every company in the industry, so one adapter serves many twins.
# Company-specific signals (Wikipedia article, GDELT news query) are added automatically.

defaults:
  history_start: 2014Q1
  kpis:
    # Revenue growth from XBRL; change mode stays close to naive when signals are weak.
    revenue_growth: {unit: pct, bounds: [-100, null], target: change, description: "total revenue, yoy %"}
    # Operating margin from XBRL; seasonal businesses lean on the same quarter last year.
    op_margin:
      unit: pct
      bounds: [null, 100]
      lag: {prior_mean: 0.3, prior_sd: 0.2}
      seasonal_lag: {prior_mean: 0.6, prior_sd: 0.2}
      description: "GAAP operating margin, % of revenue"
  edges:
    - {from: demand,     to: revenue_growth, prior_mean: 0.6,  prior_sd: 0.3}
    - {from: price,      to: revenue_growth, prior_mean: 0.3,  prior_sd: 0.3}
    - {from: sentiment,  to: revenue_growth, prior_mean: 0.2,  prior_sd: 0.2}
    - {from: input_cost, to: op_margin,      prior_mean: -0.5, prior_sd: 0.3}
    - {from: labor,      to: op_margin,      prior_mean: -0.3, prior_sd: 0.3}
    - {from: price,      to: op_margin,      prior_mean: 0.3,  prior_sd: 0.3}
    - {from: demand,     to: op_margin,      prior_mean: 0.3,  prior_sd: 0.3}
  company_signals:
    - {kind: wikipedia, primitive: demand,    confidence: 0.2, half_life_days: 30, transform: yoy_log}
    - {kind: gdelt_tone, primitive: sentiment, confidence: 0.5, half_life_days: 21, transform: level}
  baselines: [naive_last, seasonal_naive, guidance, consensus]

packs:
  restaurants:
    sic: [5810, 5812]
    template: operating
    signals:
      - {series: "fred:RSFSDP",        primitive: demand,     confidence: 0.5, half_life_days: 45, transform: yoy_log}
      - {series: "fred:CUSR0000SEFV",  primitive: price,      confidence: 0.5, half_life_days: 60, transform: yoy_log}
      - {series: "bls:CES7072200003",  primitive: labor,      confidence: 0.6, half_life_days: 60, transform: yoy_log}
      - {series: "fred:APU0000703112", primitive: input_cost, confidence: 0.4, half_life_days: 60, transform: yoy_log, lag_days: 30}

  airlines:
    sic: [4512, 4513, 4522]
    template: operating
    exclude_from_calibration: ["2020Q1:2022Q4"]
    signals:
      - {series: "tsa:checkpoint_throughput", primitive: demand,     confidence: 0.6, half_life_days: 30, transform: yoy_log}
      - {series: "fred:CUSR0000SETG01",       primitive: price,      confidence: 0.5, half_life_days: 60, transform: yoy_log}
      - {series: "fred:DJFUELUSGULF",         primitive: input_cost, confidence: 0.7, half_life_days: 30, transform: yoy_log}
      - {series: "bls:CES4348100003",         primitive: labor,      confidence: 0.5, half_life_days: 60, transform: yoy_log}

  hotels:
    sic: [7011]
    template: operating
    exclude_from_calibration: ["2020Q1:2022Q4"]
    signals:
      - {series: "tsa:checkpoint_throughput", primitive: demand, confidence: 0.4, half_life_days: 30, transform: yoy_log}
      - {series: "fred:CUSR0000SEHB",         primitive: price,  confidence: 0.6, half_life_days: 60, transform: yoy_log}
      - {series: "bls:CES7072100003",         primitive: labor,  confidence: 0.5, half_life_days: 60, transform: yoy_log}

  homebuilders:
    sic: [1520, 1531]
    template: operating
    signals:
      - {series: "fred:HOUST",        primitive: demand,     confidence: 0.5, half_life_days: 60, transform: yoy_log}
      - {series: "fred:MORTGAGE30US", primitive: demand,     confidence: 0.5, half_life_days: 30, transform: yoy_diff, sign: -1}
      - {series: "fred:CSUSHPISA",    primitive: price,      confidence: 0.5, half_life_days: 60, transform: yoy_log}
      - {series: "fred:WPU081",       primitive: input_cost, confidence: 0.4, half_life_days: 60, transform: yoy_log}
      - {series: "bls:CES2000000003", primitive: labor,      confidence: 0.4, half_life_days: 60, transform: yoy_log}

  general_retail:
    sic: [5331, 5311, 5399, 5651, 5940, 5945]
    template: operating
    signals:
      - {series: "fred:RSGMS",        primitive: demand, confidence: 0.5, half_life_days: 45, transform: yoy_log}
      - {series: "fred:CPILFESL",     primitive: price,  confidence: 0.4, half_life_days: 60, transform: yoy_log}
      - {series: "bls:CES4200000003", primitive: labor,  confidence: 0.5, half_life_days: 60, transform: yoy_log}
